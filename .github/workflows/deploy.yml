name: Deploy site to VPS

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GH_PAT
          script: |
            if [ -d duplicompare/.git ]; then
              cd duplicompare
              git pull origin main
            else
              git clone https://x-access-token:${GH_PAT}@github.com/mbehdadm/DupliCompare.git duplicompare
              cd duplicompare
            fi
            docker compose up -d --build
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
