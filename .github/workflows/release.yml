name: Release

# Every push to main runs the tests and builds Windows/macOS/Linux.
# When VERSION names a version that has no tag yet, it also publishes the
# GitHub Release v<VERSION> (the landing page links to releases/latest).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tests
        run: |
          pip install pytest
          python -m pytest -q tests
      - name: Version and tag
        id: v
        run: |
          version="$(tr -d ' \r\n' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "v$version already exists: build only."
          elif [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Will publish v$version."
          fi

  build:
    needs: check
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: DupliCompare-windows.exe
            build_path: dist/DupliCompare.exe
          - os: macos-latest
            artifact_name: DupliCompare-macos
            build_path: dist/DupliCompare
          - os: ubuntu-latest
            artifact_name: DupliCompare-linux
            build_path: dist/DupliCompare
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Tk (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build executable
        shell: bash
        run: |
          icon=""
          if [ "$RUNNER_OS" = "Windows" ]; then icon="--icon assets/icon.ico"; fi
          pyinstaller --onefile --windowed --name DupliCompare $icon \
            --add-data "assets/icon.ico:assets" drive_compare.py
          cp "${{ matrix.build_path }}" "${{ matrix.artifact_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    needs: [check, build]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: DupliCompare ${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: out/*
